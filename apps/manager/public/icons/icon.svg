<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full-bleed background with zero corner radius so Android / iOS maskable shapes never show odd borders -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner Content scaled and centered inside safe zone -->
  <g filter="url(#shadow)" transform="translate(86, 76) scale(0.88)">
    <!-- Main Pump Body -->
    <path d="M72 384 L72 80 C72 58 90 40 112 40 L240 40 C262 40 280 58 280 80 L280 384 Z" fill="#ffffff" />
    <!-- Pump Base -->
    <rect x="48" y="360" width="256" height="24" rx="8" fill="#e2e8f0" />
    
    <!-- Fuel Screen Window -->
    <rect x="104" y="80" width="144" height="88" rx="16" fill="#0f172a" />
    <!-- Screen price lines -->
    <rect x="124" y="104" width="72" height="12" rx="4" fill="#10b981" />
    <rect x="124" y="128" width="104" height="12" rx="4" fill="#38bdf8" />

    <!-- Nozzle Hose line -->
    <path d="M280 144 C336 144 344 200 344 260 C344 320 328 350 328 350" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Nozzle Gun -->
    <path d="M344 144 L344 112 C344 100 336 92 324 92 L308 92 L308 72 L288 72 L288 120 Z" fill="#ffffff" />

    <!-- Drop of fuel emblem -->
    <path d="M176 220 C176 220 220 272 220 300 C220 324 200 344 176 344 C152 344 132 324 132 300 C132 272 176 220 176 220 Z" fill="url(#dropGrad)" />
  </g>
</svg>
