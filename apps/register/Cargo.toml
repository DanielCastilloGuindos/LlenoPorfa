[package]
name = "register"
version = "0.1.0"
edition = "2021"

[lib]
name = "register_lib"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
vercel_runtime = "1.1"
url = "2.5"

[[bin]]
name = "event"
path = "api/event.rs"

[[bin]]
name = "stats"
path = "api/stats.rs"
